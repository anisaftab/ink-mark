version: "3.9"

services:
  # ─── Main dev container ───────────────────────────────────────────────────
  app:
    container_name: ink-mark
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace/ink-mark:cached
      - go-cache:/root/go
      - go-pkg:/go/pkg
      - node-modules-cache:/workspace/ink-mark/frontend/node_modules
      - cline-config:/home/vscode/.vscode-server/data/User/globalStorage/saoudrizwan.claude-dev
    command: sleep infinity
    environment:
      - GOPATH=/go
      - GOMODCACHE=/go/pkg/mod

# ─── Named volumes ────────────────────────────────────────────────────────
volumes:
  go-cache:
  go-pkg:
  node-modules-cache:
  cline-config:

